<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permit Blurb Archive</title>
<style>
  :root{
    --paper:#e9e6dd; --card:#faf8f2; --ink:#1a2430; --muted:#5f6670;
    --rule:#cfc9ba; --rule-soft:#e0dccf; --blue:#255a8a; --blue-ink:#1c4468;
    --stamp:#9c3a2f; --amber:#8a6111; --tab:#233245;
    --shadow:0 1px 0 rgba(26,36,48,.04),0 8px 24px -18px rgba(26,36,48,.5);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;
    line-height:1.5;
    background-image:radial-gradient(rgba(26,36,48,.025) 1px,transparent 1px);
    background-size:4px 4px;
  }
  .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding:14px 20px 0;
  }
  .brandrow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; max-width:1100px; margin:0 auto}
  .stamp{
    font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--stamp);
    border:1.5px solid var(--stamp); border-radius:3px; padding:3px 7px;
    transform:rotate(-3deg); white-space:nowrap;
  }
  h1{font-size:23px; margin:0; letter-spacing:-.01em; font-weight:600}
  .sub{color:var(--muted); font-size:12.5px; margin-left:auto}
  .controls{max-width:1100px; margin:12px auto 0; padding-bottom:12px}
  .searchwrap{position:relative; margin-bottom:10px}
  #q{
    width:100%; padding:11px 14px 11px 38px; font-size:15px;
    border:1.5px solid var(--rule); border-radius:7px; background:var(--card);
    font-family:inherit; color:var(--ink);
  }
  #q:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,90,138,.15)}
  .searchwrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .chip{
    font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.04em;
    padding:5px 11px; border:1.5px solid var(--rule); border-radius:20px;
    background:var(--card); color:var(--ink); cursor:pointer; user-select:none;
    transition:all .12s;
  }
  .chip:hover{border-color:var(--blue)}
  .chip.on{background:var(--tab); color:#f4f1e8; border-color:var(--tab)}
  .chip .n{opacity:.6; margin-left:5px}
  .chip.attn.on{background:var(--amber); border-color:var(--amber)}
  main{max-width:1100px; margin:18px auto 80px; padding:0 20px}
  .meta{font-family:ui-monospace,monospace; font-size:11.5px; color:var(--muted); margin-bottom:12px; letter-spacing:.03em}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px}
  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:9px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
    position:relative;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--tab)}
  .card.ban::before{background:var(--stamp)}
  .card.needs_data::before{background:var(--amber)}
  .chead{display:flex; align-items:baseline; gap:9px; padding:13px 15px 6px 18px}
  .town{font-size:17px; font-weight:600; letter-spacing:-.01em}
  .st{
    font-family:ui-monospace,monospace; font-size:10.5px; letter-spacing:.1em;
    background:var(--tab); color:#f4f1e8; border-radius:3px; padding:2px 6px; margin-left:auto;
  }
  .badge{
    font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    padding:2px 6px; border-radius:3px; margin-left:6px; white-space:nowrap;
  }
  .badge.ban{background:var(--stamp); color:#fff}
  .badge.needs{background:var(--amber); color:#fff}
  .badge.flag{background:none; color:var(--amber); border:1px solid var(--amber)}
  .blurb{padding:4px 18px 12px; font-size:14.5px; color:#232d38; white-space:pre-wrap}
  .note{
    margin:0 18px 12px; padding:8px 11px; border-left:3px solid var(--amber);
    background:rgba(138,97,17,.06); font-size:12.5px; color:#584210;
    font-family:ui-monospace,monospace; line-height:1.45;
  }
  .cfoot{margin-top:auto; border-top:1px solid var(--rule-soft); display:flex}
  .copy{
    flex:1; border:0; background:none; cursor:pointer; padding:10px;
    font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--blue-ink); display:flex; align-items:center; justify-content:center; gap:7px;
    transition:background .12s;
  }
  .copy:hover{background:rgba(37,90,138,.07)}
  .copy.done{color:#1f6b3a}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-style:italic}
  footer{max-width:1100px; margin:0 auto; padding:24px 20px 40px; color:var(--muted); font-size:11.5px; font-family:ui-monospace,monospace; border-top:1px solid var(--rule)}
  @media (max-width:520px){ .grid{grid-template-columns:1fr} h1{font-size:19px} .sub{width:100%; margin:4px 0 0} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <input id="q" type="search" placeholder="Search a town or anything in a blurb (fee, IdentoGO, notarize...)" autocomplete="off">

<main>

</main>
<footer>
  232 blurbs &middot; generated August 27, 2026 &middot; a living archive; new batches get appended. Blank cards marked NEEDS DATA are awaiting missing fields.

<script>
const DATA = [{"town": "Escondido", "state": "CA", "blurb": "For Escondido, we can submit this Business License application on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The permit fee ranges from $91 to $100 and varies based on revenue. No payment is required until your application has been reviewed and accepted — you'll receive an email confirming receipt of the application, and within about 3 business days you'll get a follow-up email with the amount due and instructions to pay online. The license is valid for one year and expires at the end of its anniversary month; it must be renewed annually, as failure to renew results in penalties of 25% per month. Since this permit requires renewal, we'll remind you when it's time to renew.", "status": "ready", "note": ""}, {"town": "Poway", "state": "CA", "blurb": "For Poway, we can submit this Solicitor's License application on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The permit fee is $50, with an additional $4 fee on top. The permit is valid for two years from date of issuance (biennial); renewal is reduced to $20 (plus the $4 fee), and since it requires renewal, we'll remind you when it's time to renew. Each rep will need to bring their Driver's License and their LiveScan fingerprinting receipt. Fingerprinting via LiveScan is also required — please have your reps complete it as soon as possible to avoid delays and bring the LiveScan receipt. Many LiveScan locations accept walk-ins, or we can help schedule an appointment — just let us know which you'd prefer. Please also note the applicant is required to appear in person to receive and sign their Identification Card. We should receive the permit within roughly 30 days to 6 weeks of submission.", "status": "ready", "note": ""}, {"town": "San Diego", "state": "CA", "blurb": "For San Diego, we can submit this Business Tax Certificate application on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The fee is $38, plus an additional $1.47 per employee (effective 7/1/2025). The certificate is valid for one year from date of issuance, and since it renews annually, we'll remind you when it's time to renew. We should receive the certificate within about 2 weeks of submission.", "status": "ready", "note": ""}, {"town": "Johnston", "state": "IA", "blurb": "For Johnston, we can submit this Door-to-Door Sales Permit application in person or by email on your behalf (just confirm everyone who will be applying so we can proceed). There's a $25 non-refundable application fee, plus a $25 non-refundable permit fee once approved. The permit is valid for 90 days, and we'll remind you when it's time to reapply. Each rep will need a background check from the Iowa Division of Criminal Investigation. We should receive the permit within about 3 business days of submission.", "status": "ready", "note": ""}, {"town": "Urbandale", "state": "IA", "blurb": "For Urbandale, we can submit this Peddler Permit application on your behalf (just confirm everyone who will be applying so we can proceed). The fee is $500 for a 90-day license; shorter terms are available if you'd prefer ($75 for a week, $25 for a day). Each rep will need a copy of their driver's license, plus an Iowa Division of Criminal Investigation (DCI) criminal history check completed at the DCI office (215 E 7th Street, Des Moines) before the application is submitted — a separate request form and payment are required for each person. We'll remind you when it's time to renew.", "status": "ready", "note": "Renewal terms conditional/ambiguous in row."}, {"town": "Waukee", "state": "IA", "blurb": "For Waukee, we can submit this Peddler/Solicitor Permit application online on your behalf (just confirm everyone who will be applying so we can proceed). There's a $5 application fee, plus a license fee — $300 for 90 days (shorter terms are available if you'd prefer: $150 for 30 days, $50 for a week, $10 for a day). There's also a $100 refundable deposit per solicitor. The permit is valid for the term you choose, and we'll remind you when it's time to reapply. Each rep will need an Iowa state background check dated within 2 weeks of the application. We should receive the permit within about 5-7 business days of submission.", "status": "ready", "note": "Have Application = False; $100 deposit is refundable (not a bond)."}, {"town": "West Des Moines", "state": "IA", "blurb": "For West Des Moines, we can submit this Solicitors Permit application online on your behalf (just confirm everyone who will be applying so we can proceed). There's a $100 application fee, plus a solicitor fee of $100 for 90 days (or $50 for 30 days). We'll remind you when it's time to reapply — only the permit fee applies on reapplication. Each rep will need an officially sealed Iowa Division of Criminal Investigation (DCI) background check dated within 30 days of the application; any reps who live outside Iowa will need an equivalent check from their home state. Fingerprinting is also required at the West Des Moines Police Department (250 Mills Civic Parkway), available Tuesdays and Thursdays from 2:00-4:00 p.m. — please have your reps go as soon as possible to avoid delays. We should receive the permit within about 5 business days of submission.\n\nWe also need a personal surety bond for the penal amount of $1,000. We can reach out to our bond liaison to get this initiated for you asap (if you'd like) — just let us know and we'll initiate that.", "status": "ready", "note": "Have Application = False; bond per-rep vs per-permit."}, {"town": "Windsor Heights", "state": "IA", "blurb": "For Windsor Heights, we can submit this Peddlers/Solicitors/Transient Merchants permit application in person or by email on your behalf (just confirm everyone who will be applying so we can proceed). There's a $20 non-refundable application fee, plus $25 per additional solicitor; permit terms are $20/day, $50/week, or $125/month. The permit is valid for up to 1 month, and we'll remind you when it's time to reapply. We should receive the permit within about 3 business days of submission.", "status": "ready", "note": ""}, {"town": "Benton", "state": "IL", "blurb": "For Benton, please notarize & mail or dropoff the signed Transient Merchant/Itinerant Vendor License application to the City Clerk's Office at City Hall @ 500 W. Main, Benton, IL 62812 (no faxes accepted). The application must be filed at least 10 business days before you intend to start selling, so please plan accordingly. The fee is $150 for vendors/solicitors (or $100 for transient merchants), payable by cash or certified check only. The license is valid through April 30 (the end of the city's fiscal year), and since it renews annually, we'll remind you when it's time to renew. Each applicant will need to bring their Driver's License, an Illinois Retailer's Occupation Tax (Sales Tax) Certificate, a State or Federal Tax ID (FEIN), a complete inventory of the goods to be sold, a notarized statement from the property owner authorizing sales from their property, and a completed Seller Information Form for the applicant and every person who will be in contact with the public (a Franklin County Health Permit is also required if applicable).\n\nWe also need a surety bond equal to 50% of the wholesale value of the merchandise to be offered for sale (no less than $1,000 and no more than $10,000); a cash deposit for the same amount is accepted in lieu of a bond. We can reach out to our bond liaison to get this initiated for you asap (if you'd like) — just let us know and we'll initiate that.", "status": "ready", "note": "Fee category: $150 solicitor vs $100 transient merchant — confirm."}, {"town": "Blue Island", "state": "IL", "blurb": "For Blue Island, we can submit this Solicitors and Itinerant Vendors permit application online on your behalf (just confirm everyone who will be applying so we can proceed). The fee is $250, and the permit is valid for one year. Since it renews annually, we'll remind you when it's time to renew.", "status": "ready", "note": "Fee per company/person unconfirmed."}, {"town": "Burbank", "state": "IL", "blurb": "For Burbank, we have been advised that D2D solicitation is not allowed within city limits. We'll check up on this town occasionally to see if/when their stance changes, but as of now, no solicitation is allowed.", "status": "ban", "note": ""}, {"town": "Carbondale", "state": "IL", "blurb": "For Carbondale, please complete the online Solicitor's Permit application at https://www.explorecarbondale.com/FormCenter/Encrypted-Forms-21/Solicitors-Permit-Application-163. The permit fee is $10 per day, and a permit can be valid for up to 30 days at a time; since it's short-term, we'll remind you when it's time to renew. A background check is done at time of application ($25 fee). Each rep will need to bring their Driver's License.", "status": "ready", "note": "Online vs notarized conflict — verify channel."}, {"town": "Carmi", "state": "IL", "blurb": "For Carmi, please notarize & dropoff the Peddler's License application to the City Clerk @ 225 E Main St, Carmi, IL 62821 (the Clerk's office is open 7 a.m.-3 p.m., Monday-Friday). The fee is $50 for the first rep and $20 for each additional rep, per calendar year (the $20 rate applies to reps tied to a company whose member already paid the $50); if an application is denied, the fee is refunded. A shorter 7-day license is available for $10 ($4 for reps tied to a company member who already paid the weekly fee) — just let us know if you'd prefer that. The license runs by calendar year, and since it renews each year, we'll remind you when it's time to renew. Each rep will need to bring their Driver's License.", "status": "ready", "note": "Background check handled internally through Carmi PD (confirmed)."}, {"town": "Des Plaines", "state": "IL", "blurb": "For Des Plaines, we can submit this Solicitor's Permit application on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The fee is $100 per applicant, plus a $50 background check and fingerprinting fee per solicitor. Fingerprinting is handled by the Police Department and requires an appointment — a receipt of payment must be issued before scheduling, so please send over your reps' best availability and we'll help coordinate. The permit is valid for 60 days from date of issuance, and we'll remind you when it's time to reapply. Each rep will need a government-issued ID, and we'll also need a Letter of Authorization, a completed Hold Harmless Agreement (signed before a notary), a copy of the owner applicant's Driver's License or State ID, and either a Good Standing Certificate from the IL Secretary of State (for LLCs, LLPs, and corporations) or an Assumed Name Certificate from the County Clerk (for sole proprietors). We should receive the permit within approximately 6-8 weeks of submission.\n\nWe also need a surety bond for the penal amount of $2,500. We can reach out to our bond liaison to get this initiated for you asap (if you'd like) — just let us know and we'll initiate that.", "status": "ready", "note": "Bond per-rep vs per-permit; background handled by PD."}, {"town": "Desoto", "state": "IL", "blurb": "For Desoto, please notarize & submit the application in person to the Chief of Police @ 210 West Lincoln Street, DeSoto, IL 62924 (office open 8 a.m.-3 p.m., Monday-Friday). The fee is $50 per person for an annual permit; a daily permit is available for $20 per person if you'd prefer. The permit is valid for one year from date of issuance, and since it renews annually, we'll remind you when it's time to renew. Each rep will need to bring their Driver's License.", "status": "ready", "note": "Background check appears town-run; confirm no rep action."}, {"town": "Du Quoin", "state": "IL", "blurb": "For DuQuoin, please notarize & submit the application in person @ 302 E. Poplar St, DuQuoin, IL 62832. The fee is $500 per person for a yearly permit; a daily permit is available for $100 per person if you'd prefer (cash or check only). The permit is valid for one year from date of issuance, and since it renews annually, we'll remind you when it's time to renew. Each rep will need to bring their Driver's License.", "status": "ready", "note": "Background check 'through Chief of Police only' — confirm rep action."}, {"town": "Elkville", "state": "IL", "blurb": "For Elkville, the application must be submitted in person, and the fee is $100. We'll remind you when it's time to renew.", "status": "needs_data", "note": "No address, permit name, or validity term — needs data."}, {"town": "Fairfield", "state": "IL", "blurb": "For Fairfield, please notarize & submit the Application for Permit to Solicit in person. The fee is $100 per person per day. A background check is also required. Each rep will need to bring their Driver's License, and we'll remind you when it's time to reapply.", "status": "ready", "note": "No submission address in row — confirm."}, {"town": "Flora", "state": "IL", "blurb": "For Flora, please submit the application in person to the City Clerk @ 131 E 2nd Street, Flora, IL 62839. The fee is $25 per person per day (the total depends on how many days you choose). We should receive the permit within about 7 days of submission, and we'll remind you when it's time to reapply.", "status": "ready", "note": ""}, {"town": "Johnston City", "state": "IL", "blurb": "For Johnston City, we can submit this Solicitors/Peddlers Permit application on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The fee is $300 per person for an annual license; a daily license is available for $50 per person per day if you'd prefer. The license is valid for one year from date of issuance, and since it renews annually, we'll remind you when it's time to renew. Each rep will need to provide a copy of their ID. We should receive the permit within about 1 day of submission.", "status": "ready", "note": ""}, {"town": "Marissa", "state": "IL", "blurb": "For Marissa, we can submit this Solicitors application on your behalf — you'll just need to get the application notarized and send the notarized copy back to us (and please confirm everyone who will be applying so we can proceed!). The fee is $50 per person for an annual permit; a daily permit is available for $10 per person if you'd prefer. The permit is valid for one year from date of issuance, and since it renews annually, we'll remind you when it's time to renew. A background check is done at time of application, with the fee already included in the permit cost.", "status": "ready", "note": ""}, {"town": "Murphysboro", "state": "IL", "blurb": "For Murphysboro, please notarize & submit the Certificate of Registration application in person @ 1101 Walnut Street, Murphysboro, IL. The fee is $150 per person for an annual license (which runs by the city's license year, May 1 through April 30); a daily license is available for $25 per person per day if you'd prefer. A background check is also required. Each rep will need to bring their Driver's License, and we'll also need a copy of your Business Registration License. We should receive the permit within about 2 weeks of submission, and since it renews annually, we'll remind you when it's time to renew.", "status": "ready", "note": ""}, {"town": "Pinckneyville", "state": "IL", "blurb": "For Pinckneyville, please notarize & submit the Certificate of Registration application in person. There is no fee. The permit is valid for 30 days, or 2 weeks if you'd prefer. A background check is also required. Fingerprinting is also required — an appointment will need to be scheduled as soon as possible to avoid delays in the process, so please send over your reps' best availability for fingerprinting so we can assist with scheduling. Each rep will need to bring their State ID. We should receive the permit within about 24-48 hours of submission, and we'll remind you when it's time to reapply.", "status": "ready", "note": "No submission address in row."}, {"town": "Riverside", "state": "IL", "blurb": "For Riverside, we can submit this Application for Solicitation on your behalf (please advise & confirm everyone who will be applying so we can proceed!). The fee is $100 per company. The permit is valid for 90 days, and we'll remind you when it's time to reapply. We should receive the permit within about 5 business days of submission.", "status": "ready", "note": ""}, {"town": "Sesser", "state": "IL", "blurb": "For Sesser, we can submit this Business License application by email on your behalf (just confirm everyone who will be applying so we can proceed). There's a $15 registration fee, plus a $75 per person per day fee. We'll remind you when it's time to reapply.", "status": "ready", "note": ""}, {"town": "St Elmo", "state": "IL", "blurb": "For St Elmo, please notarize & submit the Itinerant Merchant/Solicitors and Peddlers License application in person to the City Clerk @ 411 N Main St, St Elmo, IL 62458. The fee is $25 per person for 90 days (cash or check only). A background check is also required. Each rep will need to bring a photo ID, and we'll remind you when it's time to reapply.", "status": "ready", "note": ""}, {"town": "Vienna", "state": "IL", "blurb": "For Vienna, please submit the Solicitor's application in person @ 205 N 4th St, Vienna, IL 62995. The fee is $50 per person for an annual permit; a daily permit is available for $5 per person per day if you'd prefer. Each rep will need to bring their Driver's License. We should receive the permit within about 2 days of submission, and we'll remind you when it's time to reapply.", "status": "ready", "note": ""}, {"town": "Willisville / Williamsville", "state": "IL", "blurb": "For Williamsville, please notarize & submit the Peddling/Solicitation Permit application in person @ 141 West Main, Williamsville, is valid for 30 days, and we'll remind you when it's time to reapply. A background check is also required, which can take up to 10 business days. Each rep will need a U.S. government-issued ID.", "status": "ready", "note": ""}, {"town": "Anson", "state": "TX", "blurb": "For Anson, please submit both required applications in person or by mail @ 1301 Commercial Ave., Anson, TX 79501: a Business License ($500 annually, requires proof of a sales tax permit) and a Solicitor Application ($75, valid 30 days — we'll remind you when it's time to reapply for this one). A background check is required for the Solicitor Application. Both are typically processed within 24 business hours. Please note solicitation is prohibited within 1,000 feet of any public or private elementary/secondary school between 7:30 a.m. and 3:30 p.m. on school days.", "status": "ready", "note": "Merged two required permits (Business License + Solicitor Application) for this town."}, {"town": "Baird", "state": "TX", "blurb": "For Baird, please submit the Peddler Permit application in person @ 328 Market St, Baird, TX 79504. The fee is $10. The permit is valid for 7 days, and since it renews, we'll remind you when it's time to renew. We should receive the permit the same day of submission.", "status": "ready", "note": ""}, {"town": "Ballinger", "state": "TX", "blurb": "For Ballinger, please submit the Vendor Permit application in person or by email @ City Hall, 700 Railroad Ave., Ballinger, TX 76821. The fee is $50 per person for the first 21 days, then $5 per week to renew. A background check is also required. Each rep will need a copy of their driver's license or government-issued ID, and each applicant must appear in person to pick up the permit. Since it renews, we'll remind you when it's time to renew.", "status": "ready", "note": ""}, {"town": "Breckenridge", "state": "TX", "blurb": "For Breckenridge, please submit the Itinerant Vendor License application in person @ 105 N. Rose Avenue, Breckenridge ermit application fee is $200 (or $100 if your principal place of business is in League City), plus a $50 fee for each ID card issued. The permit is valid for one year, and we'll remind you when it's time to reapply. Each rep will need a government-issued photo ID or driver's license and one passport-size photo. We should receive the permit within about 7 business days of submission.", "status": "ready", "note": "Have Application = False."}, {"town": "Merkel", "state": "TX", "blurb": "For Merkel, please submit the application in person @ 100 Kent Street, Merkel, TX 79536. Each rep will need an ID and a pamphlet describing the services offered. Please note reps must contact Merkel City Hall each day they plan to solicit in the city to notify them.", "status": "needs_data", "note": "Missing permit name, fee, and validity."}, {"town": "Snyder", "state": "TX", "blurb": "For Snyder, please submit the Solicitor/Peddler License application in person to the City Secretary @ 1925 24th Street, Snyder, TX 79549. The fee is $75 per person per month, for up to six months at a time. A background check is conducted based on the information you provide (no separate process on your end). Each rep will need a valid driver's license or ID and a letter from your company. We'll remind you when it's time to reapply.", "status": "ready", "note": "Row also lists a TX Sales/Use Tax Permit flagged not applicable to customer acquisition — omitted."}, {"town": "Stafford", "state": "TX", "blurb": "For Stafford, please submit the Soliciting Permit application in person @ 2610 S Main St, Stafford, TX 77477. The fee is $25 per person, and the permit is valid for one year. Each rep will need their driver's license, and we'll remind you when it's time to reapply.", "status": "ready", "note": ""}, {"town": "Stamford", "state": "TX", "blurb": "For Stamford, the fee is $125, and the permit is valid for 30 days.", "status": "needs_data", "note": "Missing permit name, submission method, and confirmation of submission address."}];
let stateFilter = "ALL";
let attnOnly = false;
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
const chipsEl = document.getElementById('chips');

const states = [...new Set(DATA.map(d=>d.state))].sort();
const counts = {}; states.forEach(s=>counts[s]=DATA.filter(d=>d.state===s).length);

function makeChip(label, key, extraClass){
  const c=document.createElement('span');
  c.className='chip'+(extraClass?(' '+extraClass):'');
  c.dataset.key=key;
  c.innerHTML = label + (counts[key]!==undefined?(' <span class="n">'+counts[key]+'</span>'):'');
  return c;
}
const allChip = makeChip('ALL <span class="n">'+DATA.length+'</span>','ALL');
allChip.classList.add('on');
chipsEl.appendChild(allChip);
states.forEach(s=>chipsEl.appendChild(makeChip(s,s)));
const attnChip = document.createElement('span');
attnChip.className='chip attn'; attnChip.dataset.key='ATTN';
attnChip.innerHTML='Needs attention <span class="n">'+DATA.filter(d=>d.status!=="ready"||d.note).length+'</span>';
chipsEl.appendChild(attnChip);

chipsEl.addEventListener('click', e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  if(chip.dataset.key==='ATTN'){ attnOnly=!attnOnly; chip.classList.toggle('on',attnOnly); render(); return; }
  stateFilter=chip.dataset.key;
  [...chipsEl.querySelectorAll('.chip:not(.attn)')].forEach(c=>c.classList.toggle('on',c.dataset.key===stateFilter));
  render();
});
q.addEventListener('input', render);

function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function render(){
  const term=q.value.trim().toLowerCase();
  const rows=DATA.filter(d=>{
    if(stateFilter!=="ALL" && d.state!==stateFilter) return false;
    if(attnOnly && d.status==="ready" && !d.note) return false;
    if(term){
      const hay=(d.town+' '+d.state+' '+d.blurb+' '+d.note).toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });
  grid.innerHTML='';
  meta.textContent = rows.length+' showing'+(stateFilter!=="ALL"?(' \u00b7 '+stateFilter):'')+(attnOnly?' \u00b7 needs attention':'')+(term?(' \u00b7 "'+q.value.trim()+'"'):'');
  empty.style.display = rows.length?'none':'block';
  for(const d of rows){
    const card=document.createElement('article');
    card.className='card'+(d.status!=="ready"?(' '+d.status):'');
    let badge='';
    if(d.status==='ban') badge='<span class="badge ban">Not allowed</span>';
    else if(d.status==='needs_data') badge='<span class="badge needs">Needs data</span>';
    else if(d.note) badge='<span class="badge flag">Flag</span>';
    card.innerHTML =
      '<div class="chead"><span class="town">'+esc(d.town)+'</span>'+badge+'<span class="st">'+esc(d.state)+'</span></div>'+
      '<div class="blurb">'+esc(d.blurb)+'</div>'+
      (d.note?('<div class="note">'+esc(d.note)+'</div>'):'')+
      '<div class="cfoot"><button class="copy" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy blurb</span></button></div>';
    const btn=card.querySelector('.copy');
    btn.addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(d.blurb); }
      catch(e){ const t=document.createElement('textarea'); t.value=d.blurb; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      btn.classList.add('done'); btn.querySelector('span').textContent='Copied \u2713';
      setTimeout(()=>{ btn.classList.remove('done'); btn.querySelector('span').textContent='Copy blurb'; },1400);
    });
    grid.appendChild(card);
  }
}
render();
</script>
